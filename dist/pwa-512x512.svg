<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glowGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow512" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad512)"/>
  
  <!-- Outer Gold Border Frame -->
  <rect x="20" y="20" width="472" height="472" rx="94" fill="none" stroke="url(#goldGrad512)" stroke-width="8" stroke-opacity="0.8"/>
  <rect x="36" y="36" width="440" height="440" rx="78" fill="none" stroke="url(#goldGrad512)" stroke-width="2.5" stroke-opacity="0.35"/>

  <!-- Geometric Rub al-Hizb Star Pattern in Background -->
  <g transform="translate(256,256) scale(1.75)" opacity="0.16">
    <rect x="-60" y="-60" width="120" height="120" fill="none" stroke="url(#goldGrad512)" stroke-width="2"/>
    <rect x="-60" y="-60" width="120" height="120" fill="none" stroke="url(#goldGrad512)" stroke-width="2" transform="rotate(45)"/>
  </g>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="170" fill="url(#glowGrad512)"/>

  <!-- Stylized Open Book (Kitab) & Crest Emblem -->
  <g filter="url(#dropShadow512)">
    <!-- Left Page -->
    <path d="M 256 310 C 210 290 140 290 90 310 L 90 180 C 140 160 210 160 256 180 Z" fill="none" stroke="url(#goldGrad512)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Page -->
    <path d="M 256 310 C 302 290 372 290 422 310 L 422 180 C 372 160 302 160 256 180 Z" fill="none" stroke="url(#goldGrad512)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Spine Line -->
    <line x1="256" y1="180" x2="256" y2="310" stroke="url(#goldGrad512)" stroke-width="8" stroke-linecap="round"/>

    <!-- Radiant Light Rays (Minaret / Arch Motif) -->
    <path d="M 256 140 L 256 105 M 215 150 L 195 120 M 297 150 L 317 120" stroke="url(#goldGrad512)" stroke-width="7" stroke-linecap="round"/>

    <!-- Center Calligraphic Emblem Marker -->
    <circle cx="256" cy="235" r="12" fill="url(#goldGrad512)"/>
  </g>

  <!-- Subtitle Text "AL-BAYAN" -->
  <text x="256" y="425" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="url(#goldGrad512)" letter-spacing="8" text-anchor="middle" opacity="0.9">AL-BAYAN</text>
</svg>
