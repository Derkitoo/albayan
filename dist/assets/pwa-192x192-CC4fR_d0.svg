<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glowGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow192" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad192)"/>
  
  <!-- Outer Gold Border Frame -->
  <rect x="8" y="8" width="176" height="176" rx="36" fill="none" stroke="url(#goldGrad192)" stroke-width="3" stroke-opacity="0.75"/>
  <rect x="14" y="14" width="164" height="164" rx="30" fill="none" stroke="url(#goldGrad192)" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Geometric Rub al-Hizb Star Pattern in Background -->
  <g transform="translate(96,96) scale(0.65)" opacity="0.18">
    <rect x="-60" y="-60" width="120" height="120" fill="none" stroke="url(#goldGrad192)" stroke-width="2"/>
    <rect x="-60" y="-60" width="120" height="120" fill="none" stroke="url(#goldGrad192)" stroke-width="2" transform="rotate(45)"/>
  </g>

  <!-- Glowing Aura -->
  <circle cx="96" cy="96" r="64" fill="url(#glowGrad192)"/>

  <!-- Stylized Open Book (Kitab) & Crest Logo Symbol -->
  <g filter="url(#dropShadow192)">
    <!-- Left Page -->
    <path d="M 96 116 C 80 108 52 108 34 116 L 34 68 C 52 60 80 60 96 68 Z" fill="none" stroke="url(#goldGrad192)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Page -->
    <path d="M 96 116 C 112 108 140 108 158 116 L 158 68 C 140 60 112 60 96 68 Z" fill="none" stroke="url(#goldGrad192)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Spine Line -->
    <line x1="96" y1="68" x2="96" y2="116" stroke="url(#goldGrad192)" stroke-width="3" stroke-linecap="round"/>

    <!-- Radiant Light Rays (Minaret / Arch Motif) -->
    <path d="M 96 52 L 96 40 M 80 56 L 72 46 M 112 56 L 120 46" stroke="url(#goldGrad192)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Center Calligraphic Emblem Star Marker -->
    <circle cx="96" cy="88" r="5" fill="url(#goldGrad192)"/>
  </g>
</svg>
